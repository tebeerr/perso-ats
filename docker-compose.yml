services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/ats.db
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

